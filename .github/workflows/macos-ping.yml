name: macos-ping
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "runner=${{ matrix.os }} os=$(uname -s) arch=$(uname -m)"
      - run: xcodebuild -version || true
